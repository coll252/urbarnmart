<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UrbanMart Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>

  <style>
    :root{
      --primary:#0f172a;
      --secondary:#1e293b;
      --accent:#10b981;
      --bg:#f8fafc;
      --surface:#ffffff;
      --text:#334155;
      --muted:#94a3b8;
      --border:#e2e8f0;
      --danger:#ef4444;
      --warning:#f59e0b;
      --success:#10b981;
      --info:#3b82f6;
      --mpesa:#22c55e;
      --shadow:0 10px 30px rgba(15,23,42,.08);
      --shadow-lg:0 20px 50px rgba(15,23,42,.14);
      --modal-bg:rgba(15,23,42,.58);
      --radius-xl:28px;
      --radius-lg:20px;
      --radius-md:16px;
      --radius-sm:12px;
      --maxw:1240px;
    }

    body.dark-mode{
      --primary:#f8fafc;
      --secondary:#cbd5e1;
      --bg:#020617;
      --surface:#0f172a;
      --text:#e2e8f0;
      --muted:#94a3b8;
      --border:#1e293b;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --shadow-lg:0 20px 50px rgba(0,0,0,.52);
      --modal-bg:rgba(2,6,23,.82);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      transition:.25s ease;
    }
    a{text-decoration:none;color:inherit}
    button,input,select,textarea{font:inherit}
    img{max-width:100%}
    .hidden{display:none!important}
    .container{width:min(var(--maxw),92%);margin:auto}

    .topbar{
      background:linear-gradient(90deg,var(--accent),#059669);
      color:#fff;
      padding:10px 0;
      font-size:13px;
      font-weight:600;
    }
    .topbar .container{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }

    .navbar{
      position:sticky;
      top:0;
      z-index:60;
      background:rgba(255,255,255,.88);
      backdrop-filter:blur(18px);
      border-bottom:1px solid var(--border);
    }
    body.dark-mode .navbar{background:rgba(2,6,23,.88)}
    .navbar .container{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      min-height:78px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:24px;
      font-weight:800;
      color:var(--primary);
      cursor:pointer;
    }
    .brand i{color:var(--accent)}

    .navlinks{
      display:flex;
      align-items:center;
      gap:22px;
      color:var(--secondary);
      font-weight:700;
    }
    .navlinks a:hover{color:var(--accent)}

    .navactions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .iconbtn,.pillbtn,.btn,.btn-secondary,.btn-danger,.btn-outline,.outline-btn,.danger-btn,.tiny{
      border:none;
      cursor:pointer;
      transition:.2s ease;
    }
    .iconbtn{
      width:44px;height:44px;border-radius:14px;
      display:grid;place-items:center;
      background:var(--surface);
      border:1px solid var(--border);
      color:var(--primary);
      position:relative;
    }
    .iconbtn:hover,.pillbtn:hover,.btn:hover,.btn-secondary:hover,.outline-btn:hover,.tiny:hover{
      transform:translateY(-1px);
      box-shadow:var(--shadow);
    }
    .count{
      position:absolute;
      top:-6px;
      right:-6px;
      min-width:22px;
      height:22px;
      padding:0 6px;
      border-radius:999px;
      display:grid;
      place-items:center;
      background:var(--accent);
      color:#fff;
      font-size:12px;
      font-weight:800;
      border:2px solid var(--surface);
    }
    .pillbtn{
      padding:12px 16px;
      border-radius:14px;
      background:var(--surface);
      border:1px solid var(--border);
      color:var(--secondary);
      font-weight:800;
    }

    .hero{padding:34px 0 18px}
    .hero-box{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:28px;
      align-items:center;
      padding:34px;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      border-radius:32px;
      color:#fff;
      box-shadow:var(--shadow-lg);
      overflow:hidden;
    }
    body.dark-mode .hero-box{background:linear-gradient(135deg,#020617,#0f172a)}
    .hero-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.14);
      color:#d1fae5;
      font-weight:800;
      font-size:13px;
      margin-bottom:14px;
    }
    .hero h1{
      margin:0 0 12px;
      font-size:46px;
      line-height:1.07;
    }
    .hero p{
      margin:0 0 22px;
      color:rgba(255,255,255,.84);
      max-width:620px;
      line-height:1.75;
      font-size:15px;
    }
    .hero-actions{display:flex;gap:12px;flex-wrap:wrap}
    .hero-card{
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.10);
      border-radius:28px;
      min-height:320px;
      padding:18px;
      display:grid;
      place-items:center;
    }
    .hero-card img{
      width:100%;
      max-width:340px;
      max-height:340px;
      object-fit:contain;
      filter:drop-shadow(0 20px 30px rgba(0,0,0,.30));
    }

    .btn,.btn-secondary,.btn-danger,.btn-outline,.outline-btn,.danger-btn{
      padding:14px 18px;
      border-radius:16px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      font-weight:800;
    }
    .btn{background:var(--accent);color:#fff}
    .btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--primary)}
    .btn-outline,.outline-btn{background:transparent;border:1px solid var(--border);color:var(--primary)}
    .btn-danger,.danger-btn{background:var(--danger);color:#fff}

    .section{padding:14px 0 28px}
    .search-wrap{
      background:var(--surface);
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      border-radius:28px;
      padding:18px;
      display:grid;
      gap:14px;
    }
    .searchbox{position:relative}
    .searchbox i{
      position:absolute;
      top:50%;
      left:16px;
      transform:translateY(-50%);
      color:var(--muted);
    }
    .searchbox input,.field,.form-control{
      width:100%;
      height:54px;
      padding:0 16px 0 46px;
      border-radius:16px;
      border:1px solid var(--border);
      outline:none;
      background:var(--surface);
      color:var(--text);
    }
    .field,.form-control{padding:0 16px}
    textarea.field,textarea.form-control{
      height:auto;
      min-height:120px;
      padding:14px 16px;
      resize:vertical;
    }
    .searchbox input:focus,.field:focus,.form-control:focus{border-color:var(--accent)}

    .chips{display:flex;gap:10px;flex-wrap:wrap}
    .chip{
      padding:10px 14px;
      border-radius:999px;
      background:var(--surface);
      border:1px solid var(--border);
      cursor:pointer;
      font-weight:800;
      color:var(--secondary);
    }
    .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

    .title-row,.section-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      margin:20px 0 16px;
      flex-wrap:wrap;
    }
    .title-row h2,.section-head h2,.section-head h3{
      margin:0;
      color:var(--primary);
    }
    .title-row h2{font-size:28px}

    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
      gap:20px;
    }
    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:24px;
      overflow:hidden;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      min-height:100%;
    }
    .card-media{
      background:linear-gradient(180deg,var(--bg),var(--surface));
      height:220px;
      position:relative;
      display:grid;
      place-items:center;
      padding:18px;
      border-bottom:1px solid var(--border);
    }
    .card-media img{
      width:100%;
      height:100%;
      object-fit:contain;
    }
    .wishlist-btn{
      position:absolute;
      top:12px;
      right:12px;
      width:38px;
      height:38px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:var(--surface);
      border:1px solid var(--border);
      color:var(--muted);
      cursor:pointer;
    }
    .wishlist-btn.active{color:var(--danger)}
    .card-body{
      display:flex;
      flex-direction:column;
      gap:10px;
      padding:18px;
      flex:1;
    }
    .name{
      font-size:17px;
      line-height:1.45;
      color:var(--primary);
      font-weight:800;
    }
    .muted{color:var(--muted)}
    .small{font-size:13px}
    .price-row{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:auto;
      flex-wrap:wrap;
    }
    .price{
      color:var(--accent);
      font-size:20px;
      font-weight:800;
    }
    .old{
      color:var(--muted);
      text-decoration:line-through;
      font-size:14px;
    }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .actions button{flex:1}

    .tag,.label,.status{
      display:inline-flex;
      width:max-content;
      padding:8px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
    }
    .tag{background:#ecfdf5;color:#047857}
    body.dark-mode .tag{background:rgba(16,185,129,.18);color:#6ee7b7}

    .rating{
      display:flex;
      align-items:center;
      gap:4px;
      color:#fbbf24;
      font-size:13px;
      flex-wrap:wrap;
    }

    .empty{
      padding:42px 20px;
      text-align:center;
      background:var(--surface);
      border:1px dashed var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
      color:var(--muted);
    }

    .panel,.box,.stat{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
    }
    .panel{padding:20px}
    .box{padding:20px}
    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:16px;
      margin-bottom:20px;
    }
    .stat{padding:20px}
    .stat .label{
      padding:0;
      background:none;
      color:var(--muted);
      letter-spacing:.08em;
      text-transform:uppercase;
      font-size:12px;
    }
    .stat .value{
      margin-top:8px;
      color:var(--primary);
      font-size:30px;
      font-weight:800;
    }

    .admin-layout{
      display:grid;
      grid-template-columns:280px 1fr;
      min-height:100vh;
    }
    .sidebar{
      position:sticky;
      top:0;
      height:100vh;
      padding:20px 16px;
      background:var(--surface);
      border-right:1px solid var(--border);
    }
    .sidebar-brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:22px;
      font-weight:800;
      color:var(--primary);
      margin-bottom:22px;
    }
    .side-menu{
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .side-link{
      border:none;
      width:100%;
      text-align:left;
      padding:14px;
      border-radius:16px;
      background:transparent;
      color:var(--secondary);
      cursor:pointer;
      font-weight:800;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .side-link.active,.side-link:hover{
      background:rgba(16,185,129,.1);
      color:var(--accent);
    }
    .admin-main{padding:24px}
    .admin-grid{
      display:grid;
      grid-template-columns:1.15fr .85fr;
      gap:18px;
    }

    .table-wrap{
      overflow:auto;
      border:1px solid var(--border);
      border-radius:20px;
      background:var(--surface);
    }
    table{width:100%;border-collapse:collapse;min-width:760px}
    th,td{
      padding:14px 16px;
      border-bottom:1px solid var(--border);
      text-align:left;
      vertical-align:top;
    }
    th{
      background:var(--bg);
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--muted);
    }
    .row-actions,.card-actions{display:flex;gap:8px;flex-wrap:wrap}
    .tiny{
      padding:10px 12px;
      border-radius:12px;
      background:var(--surface);
      border:1px solid var(--border);
      color:var(--primary);
      font-weight:800;
    }

    .status.Pending{background:rgba(194,65,12,.12);color:#c2410c}
    .status.Processing{background:rgba(217,119,6,.12);color:#d97706}
    .status.Packed{background:rgba(79,70,229,.12);color:#4f46e5}
    .status.Shipped{background:rgba(29,78,216,.12);color:#1d4ed8}
    .status.Delivered{background:rgba(4,120,87,.12);color:#047857}
    .status.Cancelled{background:rgba(185,28,28,.12);color:#b91c1c}

    .modal{
      position:fixed;
      inset:0;
      background:var(--modal-bg);
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:100;
      backdrop-filter:blur(4px);
    }
    .modal.show{display:flex}
    .modal-card{
      width:min(760px,100%);
      max-height:90vh;
      overflow:auto;
      background:var(--surface);
      border-radius:28px;
      padding:24px;
      box-shadow:var(--shadow-lg);
      border:1px solid var(--border);
    }
    .modal-card.small{max-width:440px}
    .modal-card.large{width:min(1020px,100%)}
    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-bottom:18px;
    }
    .close-btn,.close{
      width:42px;height:42px;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--primary);
      cursor:pointer;
    }

    .form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    .form-group label{font-size:14px;font-weight:800;color:var(--secondary)}
    .two-col,.form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .drawer{
      position:fixed;
      top:0;right:-480px;
      width:min(460px,100%);
      height:100vh;
      background:var(--surface);
      border-left:1px solid var(--border);
      box-shadow:var(--shadow-lg);
      z-index:110;
      transition:.28s ease;
      display:flex;
      flex-direction:column;
    }
    .drawer.show{right:0}
    .drawer-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px 20px;
      border-bottom:1px solid var(--border);
    }
    .drawer-body{
      padding:18px 20px;
      overflow:auto;
      flex:1;
    }

    .cart-item{
      display:grid;
      grid-template-columns:72px 1fr auto;
      gap:14px;
      align-items:center;
      padding:14px 0;
      border-bottom:1px solid var(--border);
    }
    .cart-item img{
      width:72px;height:72px;
      object-fit:contain;
      border-radius:14px;
      background:var(--bg);
      border:1px solid var(--border);
      padding:8px;
    }
    .qty-row{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:8px;
    }
    .qty-btn{
      width:34px;height:34px;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--primary);
      cursor:pointer;
    }

    .summary-row{
      display:flex;
      justify-content:space-between;
      gap:16px;
      font-size:14px;
      color:var(--muted);
      margin-bottom:8px;
    }
    .coupon-box{
      display:flex;
      gap:10px;
      margin:16px 0;
      flex-wrap:wrap;
    }
    .coupon-box input{flex:1;min-width:160px}

    .timeline{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      position:relative;
      margin:20px 0;
    }
    .timeline::before{
      content:'';
      position:absolute;
      left:0;right:0;
      top:15px;
      height:2px;
      background:var(--border);
      z-index:0;
    }
    .timeline-step{
      position:relative;
      z-index:1;
      background:var(--surface);
      padding:0 6px;
      text-align:center;
      flex:1;
    }
    .timeline-icon{
      width:30px;height:30px;
      border-radius:50%;
      display:grid;place-items:center;
      margin:0 auto 8px;
      border:2px solid var(--border);
      color:var(--muted);
      background:var(--surface);
      font-size:12px;
    }
    .timeline-step.active .timeline-icon{
      border-color:var(--accent);
      background:var(--accent);
      color:#fff;
    }
    .timeline-label{
      font-size:12px;
      font-weight:800;
      color:var(--muted);
    }
    .timeline-step.active .timeline-label{color:var(--primary)}

    .toast-wrap{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:200;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .toast{
      min-width:280px;
      max-width:420px;
      padding:14px 16px;
      border-radius:16px;
      background:var(--surface);
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      font-weight:700;
    }
    .toast.success{border-left:4px solid var(--success)}
    .toast.error{border-left:4px solid var(--danger)}

    .address-card,.notification-card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px;
      box-shadow:var(--shadow);
    }
    .tabs{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }
    .tab{
      padding:10px 14px;
      border-radius:999px;
      border:1px solid var(--border);
      background:var(--surface);
      cursor:pointer;
      font-weight:800;
      color:var(--secondary);
    }
    .tab.active{
      background:var(--accent);
      color:#fff;
      border-color:var(--accent);
    }

    .skeleton{
      border-radius:18px;
      background:linear-gradient(90deg,var(--bg) 25%, rgba(148,163,184,.16) 37%, var(--bg) 63%);
      background-size:400% 100%;
      animation:shimmer 1.4s infinite;
      min-height:220px;
    }
    @keyframes shimmer{
      0%{background-position:100% 0}
      100%{background-position:0 0}
    }

    @media (max-width:1024px){
      .hero-box,.admin-grid,.admin-layout,.two-col,.form-grid{grid-template-columns:1fr}
      .sidebar{position:relative;height:auto}
    }
    @media (max-width:760px){
      .navlinks{display:none}
      .hero h1{font-size:34px}
      .title-row h2{font-size:24px}
      .admin-main{padding:16px}
      .hero-box{padding:24px}
      .cart-item{grid-template-columns:62px 1fr}
      .cart-item > div:last-child{grid-column:2}
      .drawer{width:100%}
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div class="toast-wrap" id="toastWrap"></div>

  <div class="drawer" id="cartDrawer">
    <div class="drawer-head">
      <h3 style="margin:0;color:var(--primary)">Your Cart</h3>
      <button class="close-btn" onclick="closeDrawer()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawer-body" id="cartDrawerContent"></div>
  </div>

  <div class="modal" id="authModal">
    <div class="modal-card small" id="authModalContent"></div>
  </div>

  <div class="modal" id="profileModal">
    <div class="modal-card large" id="profileModalContent"></div>
  </div>

  <div class="modal" id="productDetailModal">
    <div class="modal-card large" id="productDetailContent"></div>
  </div>

  <div class="modal" id="productModal">
    <div class="modal-card" id="productModalContent"></div>
  </div>

  <div class="modal" id="csvModal">
    <div class="modal-card small" id="csvModalContent"></div>
  </div>

  <div class="modal" id="addressModal">
    <div class="modal-card small" id="addressModalContent"></div>
  </div>

  <div class="modal" id="reviewModal">
    <div class="modal-card small" id="reviewModalContent"></div>
  </div>

  <script>
    const API_URL = window.location.hostname === 'localhost'
      ? 'http://localhost:5000/api'
      : '/api';

    const state = {
      products: [],
      categories: [],
      settings: {},
      cart: [],
      orders: [],
      users: [],
      auditLogs: [],
      stats: {},
      wishlist: JSON.parse(localStorage.getItem('urbanmart_wishlist') || '[]'),
      notifications: JSON.parse(localStorage.getItem('urbanmart_notifications') || '[]'),
      recentlyViewed: JSON.parse(localStorage.getItem('urbanmart_recent') || '[]'),
      addresses: JSON.parse(localStorage.getItem('urbanmart_addresses') || '[]'),
      search: '',
      currentCategory: 'all',
      page: 'store',
      currentUser: null,
      token: localStorage.getItem('urbanmart_token') || '',
      darkMode: localStorage.getItem('urbanmart_dark') === 'true',
      adminTab: 'dashboard',
      productPage: 1,
      productsPerPage: 8,
      selectedProduct: null,
      discount: 0,
      reviewDraft: { productId: null, rating: 5, comment: '' },
      profileTab: 'orders',
      bootstrapped: false,
      charts: {}
    };

    function decodeToken(token){
      try{return JSON.parse(atob(token.split('.')[1]))}catch{return null}
    }

    if(state.token){
      const payload = decodeToken(state.token);
      if(payload){
        state.currentUser = {
          id: payload.id,
          name: payload.name,
          email: payload.email || '',
          role: payload.role,
          referral_code: payload.referral_code || null,
          points: payload.points || 0
        };
      }else{
        localStorage.removeItem('urbanmart_token');
        state.token = '';
      }
    }

    function persistLocal(){
      localStorage.setItem('urbanmart_wishlist', JSON.stringify(state.wishlist));
      localStorage.setItem('urbanmart_notifications', JSON.stringify(state.notifications));
      localStorage.setItem('urbanmart_recent', JSON.stringify(state.recentlyViewed));
      localStorage.setItem('urbanmart_addresses', JSON.stringify(state.addresses));
    }

    function escapeHtml(value){
      return String(value ?? '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#39;');
    }

    function formatMoney(value){
      return 'KSh ' + Number(value || 0).toLocaleString('en-KE', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function toast(message, type='success'){
      const wrap = document.getElementById('toastWrap');
      const node = document.createElement('div');
      node.className = `toast ${type}`;
      node.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${escapeHtml(message)}`;
      wrap.appendChild(node);
      setTimeout(()=>node.remove(), 3400);
    }

    async function apiFetch(endpoint, options = {}){
      const headers = options.headers ? { ...options.headers } : {};
      if(state.token) headers.Authorization = `Bearer ${state.token}`;
      if(!(options.body instanceof FormData) && !headers['Content-Type']){
        headers['Content-Type'] = 'application/json';
      }

      const res = await fetch(`${API_URL}${endpoint}`, {
        ...options,
        headers
      });

      const text = await res.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; }
      catch { data = { error: text || 'Request failed' }; }

      if(!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function addNotification(title, body){
      state.notifications.unshift({
        id: Date.now(),
        title,
        body,
        createdAt: new Date().toISOString()
      });
      state.notifications = state.notifications.slice(0, 20);
      persistLocal();
    }

    function setTheme(){
      if(state.darkMode) document.body.classList.add('dark-mode');
      else document.body.classList.remove('dark-mode');
    }

    function toggleDarkMode(){
      state.darkMode = !state.darkMode;
      localStorage.setItem('urbanmart_dark', String(state.darkMode));
      setTheme();
      render();
    }

    function generateStars(rating = 4){
      const full = Math.floor(Number(rating) || 0);
      const half = (Number(rating) % 1) >= .5 ? 1 : 0;
      const empty = Math.max(0, 5 - full - half);
      return `
        <div class="rating">
          ${'<i class="fa-solid fa-star"></i>'.repeat(full)}
          ${half ? '<i class="fa-solid fa-star-half-stroke"></i>' : ''}
          ${'<i class="fa-regular fa-star"></i>'.repeat(empty)}
          <span class="muted" style="margin-left:4px;">${Number(rating || 0).toFixed(1)}</span>
        </div>
      `;
    }

    function productImage(p){
      return p?.image || '';
    }

    function rememberViewed(productId){
      state.recentlyViewed = [productId, ...state.recentlyViewed.filter(id => Number(id) !== Number(productId))].slice(0, 12);
      persistLocal();
    }

    function openModal(id){ document.getElementById(id).classList.add('show'); }
    function closeModal(id){ document.getElementById(id).classList.remove('show'); }
    function openDrawer(){ document.getElementById('cartDrawer').classList.add('show'); }
    function closeDrawer(){ document.getElementById('cartDrawer').classList.remove('show'); }

    const debouncedSearch = (() => {
      let timer;
      return (val) => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          state.search = val;
          state.productPage = 1;
          render();
        }, 250);
      };
    })();

    async function bootstrap(){
      try{
        const data = await apiFetch('/bootstrap');
        state.products = data.products || [];
        state.categories = data.categories || [];
        state.settings = data.settings || {};
        state.bootstrapped = true;

        if(state.currentUser && state.currentUser.role !== 'admin'){
          await Promise.allSettled([loadCart(), loadOrders()]);
        }else if(state.currentUser && state.currentUser.role === 'admin'){
          await loadAdminData();
        }
      }catch(e){
        toast(e.message, 'error');
      }
    }

    async function loadCart(){
      if(!state.currentUser || state.currentUser.role === 'admin') return;
      try{
        state.cart = await apiFetch('/cart');
      }catch(e){
        state.cart = [];
      }
    }

    async function loadOrders(){
      if(!state.currentUser) return;
      try{
        state.orders = await apiFetch('/orders');
      }catch(e){
        state.orders = [];
      }
    }

    async function loadAdminData(){
      try{
        const [stats, orders, users, audit] = await Promise.all([
          apiFetch('/admin/stats'),
          apiFetch('/orders'),
          apiFetch('/users'),
          apiFetch('/admin/audit')
        ]);
        state.stats = stats || {};
        state.orders = orders || [];
        state.users = users || [];
        state.auditLogs = audit || [];
      }catch(e){
        toast(e.message, 'error');
      }
    }

    function updateCount(){
      return state.cart.reduce((sum, item) => sum + Number(item.quantity || 0), 0);
    }

    function filteredProducts(){
      return state.products.filter(p => {
        const matchCategory = state.currentCategory === 'all' || p.category_slug === state.currentCategory;
        const q = state.search.trim().toLowerCase();
        const matchSearch = !q ||
          String(p.name || '').toLowerCase().includes(q) ||
          String(p.description || '').toLowerCase().includes(q) ||
          String(p.category_slug || '').toLowerCase().includes(q);
        return matchCategory && matchSearch;
      });
    }

    function pagedProducts(){
      const filtered = filteredProducts();
      const end = state.productPage * state.productsPerPage;
      return {
        items: filtered.slice(0, end),
        total: filtered.length,
        hasMore: end < filtered.length
      };
    }

    function renderProductCard(p){
      const inWishlist = state.wishlist.includes(p.id);
      return `
        <div class="card">
          <div class="card-media" onclick="openProductDetail(${p.id})" style="cursor:pointer">
            <button class="wishlist-btn ${inWishlist ? 'active' : ''}" onclick="event.stopPropagation();toggleWishlist(${p.id})">
              <i class="fa-${inWishlist ? 'solid' : 'regular'} fa-heart"></i>
            </button>
            ${productImage(p)
              ? `<img src="${escapeHtml(productImage(p))}" alt="${escapeHtml(p.name)}" loading="lazy">`
              : `<i class="fa-solid fa-image" style="font-size:56px;color:var(--muted)"></i>`
            }
          </div>
          <div class="card-body">
            ${Number(p.stock) <= 5 && Number(p.stock) > 0 ? `<div class="tag" style="background:rgba(239,68,68,.12);color:#ef4444">Only ${p.stock} left</div>` : ''}
            ${Number(p.is_best_selling) === 1 ? `<div class="tag">Premium pick</div>` : ''}
            <div class="name">${escapeHtml(p.name)}</div>
            ${generateStars(p.rating || 4)}
            <div class="price-row">
              <div class="price">${formatMoney(p.price)}</div>
              ${p.old_price ? `<div class="old">${formatMoney(p.old_price)}</div>` : ''}
            </div>
            <div class="actions">
              <button class="btn-secondary" onclick="openProductDetail(${p.id})">View</button>
              ${
                !state.currentUser
                  ? `<button class="btn" onclick="showAuth('login')">Login to Buy</button>`
                  : state.currentUser.role === 'admin'
                    ? `<button class="btn" onclick="openAdmin()">Manage</button>`
                    : Number(p.stock) > 0
                      ? `<button class="btn" onclick="addToCart(${p.id})">Add to Cart</button>`
                      : `<button class="btn-secondary" disabled>Out of Stock</button>`
              }
            </div>
          </div>
        </div>
      `;
    }

    function storeView(){
      const categoryChips = [
        `<button class="chip ${state.currentCategory === 'all' ? 'active' : ''}" onclick="setCategory('all')">All</button>`,
        ...state.categories.map(cat => `
          <button class="chip ${state.currentCategory === cat.slug ? 'active' : ''}" onclick="setCategory('${escapeHtml(cat.slug)}')">
            <i class="fa-solid ${escapeHtml(cat.icon || 'fa-tag')}"></i> ${escapeHtml(cat.name)}
          </button>
        `)
      ].join('');

      const heroProduct = state.products.find(p => Number(p.id) === Number(state.settings.hero_product_id)) || state.products[0] || null;
      const page = pagedProducts();
      const recent = state.products.filter(p => state.recentlyViewed.includes(p.id)).slice(0, 4);
      const recommended = state.products.filter(p => Number(p.is_best_selling) === 1).slice(0, 4);

      return `
        <div class="topbar">
          <div class="container">
            <div><i class="fa-solid fa-truck-fast"></i> Fast delivery • Secure checkout • Real-time order status</div>
            <div><i class="fa-solid fa-shield-heart"></i> Built for mobile, admin control, and customer trust</div>
          </div>
        </div>

        <div class="navbar">
          <div class="container">
            <div class="brand" onclick="goHome()"><i class="fa-solid fa-layer-group"></i> UrbanMart</div>

            <div class="navlinks">
              <a onclick="scrollToShop()">Shop</a>
              <a onclick="showWishlistPage()">Wishlist</a>
              <a onclick="showNotificationsPage()">Notifications</a>
              ${state.currentUser ? `<a onclick="showProfile()">Account</a>` : ''}
            </div>

            <div class="navactions">
              <button class="iconbtn" onclick="toggleDarkMode()" title="Theme">
                <i class="fa-solid ${state.darkMode ? 'fa-sun' : 'fa-moon'}"></i>
              </button>

              <button class="iconbtn ${state.wishlist.length ? 'active' : ''}" onclick="showWishlistPage()" title="Wishlist">
                <i class="fa-solid fa-heart"></i>
                ${state.wishlist.length ? `<span class="count" style="background:var(--danger)">${state.wishlist.length}</span>` : ''}
              </button>

              <button class="iconbtn" onclick="showNotificationsPage()" title="Notifications">
                <i class="fa-solid fa-bell"></i>
                ${state.notifications.length ? `<span class="count" style="background:var(--info)">${state.notifications.length}</span>` : ''}
              </button>

              ${
                state.currentUser
                  ? `<button class="pillbtn" onclick="showProfile()"><i class="fa-solid fa-user"></i> ${escapeHtml((state.currentUser.name || 'User').split(' ')[0])}</button>`
                  : `<button class="pillbtn" onclick="showAuth('login')"><i class="fa-solid fa-right-to-bracket"></i> Login</button>`
              }

              ${
                (!state.currentUser || state.currentUser.role !== 'admin')
                  ? `<button class="iconbtn" onclick="showCart()"><i class="fa-solid fa-bag-shopping"></i>${updateCount() ? `<span class="count">${updateCount()}</span>` : ''}</button>`
                  : ''
              }
            </div>
          </div>
        </div>

        <section class="hero">
          <div class="container">
            <div class="hero-box">
              <div>
                <div class="hero-badge"><i class="fa-solid fa-star"></i> Premium selection</div>
                <h1>${heroProduct ? escapeHtml(heroProduct.name) : 'Smarter shopping, faster delivery'}</h1>
                <p>${heroProduct ? escapeHtml(heroProduct.description || 'Discover premium products with a seamless, trusted shopping experience.') : 'Discover premium products with a seamless, trusted shopping experience.'}</p>
                <div class="hero-actions">
                  <button class="btn" onclick="scrollToShop()">Shop Collection</button>
                  <button class="btn-outline" onclick="showProfile()">My Orders</button>
                </div>
              </div>
              <div class="hero-card">
                ${heroProduct && productImage(heroProduct)
                  ? `<img src="${escapeHtml(productImage(heroProduct))}" alt="Featured product">`
                  : `<i class="fa-solid fa-box-open" style="font-size:96px;color:#dbeafe"></i>`}
              </div>
            </div>
          </div>
        </section>

        <section class="section" id="shopSection">
          <div class="container">
            <div class="search-wrap">
              <div class="searchbox">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" value="${escapeHtml(state.search)}" placeholder="Search products, categories, features..." oninput="debouncedSearch(this.value)">
              </div>
              <div class="chips">${categoryChips}</div>
            </div>

            <div class="title-row">
              <h2>${state.currentCategory === 'all' ? 'Our Collection' : escapeHtml(state.categories.find(c => c.slug === state.currentCategory)?.name || 'Products')}</h2>
              <div class="muted">${page.total} product(s)</div>
            </div>

            ${
              page.items.length
                ? `<div class="grid">${page.items.map(renderProductCard).join('')}</div>`
                : `<div class="empty"><i class="fa-solid fa-box-open" style="font-size:44px;margin-bottom:10px"></i><div>No products match your criteria.</div></div>`
            }

            ${page.hasMore ? `
              <div style="text-align:center;margin-top:18px">
                <button class="btn-secondary" onclick="loadMoreProducts()">Load More</button>
              </div>
            ` : ''}
          </div>
        </section>

        ${recommended.length ? `
          <section class="section">
            <div class="container">
              <div class="title-row">
                <h2>Recommended for You</h2>
                <div class="muted">Top featured picks</div>
              </div>
              <div class="grid">${recommended.map(renderProductCard).join('')}</div>
            </div>
          </section>
        ` : ''}

        ${recent.length ? `
          <section class="section">
            <div class="container">
              <div class="title-row">
                <h2>Recently Viewed</h2>
                <div class="muted">Continue where you left off</div>
              </div>
              <div class="grid">${recent.map(renderProductCard).join('')}</div>
            </div>
          </section>
        ` : ''}
      `;
    }

    function render(){
      setTheme();

      if(!state.bootstrapped){
        document.getElementById('app').innerHTML = `
          <div class="container" style="padding:26px 0">
            <div class="skeleton"></div>
            <div style="height:18px"></div>
            <div class="grid">
              <div class="skeleton"></div>
              <div class="skeleton"></div>
              <div class="skeleton"></div>
              <div class="skeleton"></div>
            </div>
          </div>
        `;
        return;
      }

      if(state.currentUser?.role === 'admin' && state.page === 'admin'){
        renderAdmin();
      }else{
        document.getElementById('app').innerHTML = storeView();
      }
    }

    function setCategory(slug){
      state.currentCategory = slug;
      state.productPage = 1;
      render();
    }

    function loadMoreProducts(){
      state.productPage += 1;
      render();
    }

    function scrollToShop(){
      document.getElementById('shopSection')?.scrollIntoView({ behavior: 'smooth' });
    }

    function goHome(){
      state.page = 'store';
      state.currentCategory = 'all';
      state.search = '';
      state.productPage = 1;
      render();
      window.scrollTo(0,0);
    }

    function toggleWishlist(id){
      if(state.wishlist.includes(id)){
        state.wishlist = state.wishlist.filter(x => Number(x) !== Number(id));
        toast('Removed from wishlist');
      }else{
        state.wishlist.push(id);
        toast('Added to wishlist');
      }
      persistLocal();
      render();
    }

    function showWishlistPage(){
      const products = state.products.filter(p => state.wishlist.includes(p.id));
      document.getElementById('app').innerHTML = `
        <div class="container" style="padding:28px 0">
          <div class="title-row">
            <h2><i class="fa-solid fa-heart" style="color:var(--danger)"></i> Wishlist</h2>
            <div class="muted">${products.length} item(s)</div>
          </div>
          ${
            products.length
              ? `<div class="grid">${products.map(renderProductCard).join('')}</div>`
              : `<div class="empty"><i class="fa-regular fa-heart" style="font-size:44px;margin-bottom:10px"></i><div>Your wishlist is empty.</div></div>`
          }
          <div style="margin-top:16px"><button class="btn-secondary" onclick="goHome()">Back to Store</button></div>
        </div>
      `;
    }

    function showNotificationsPage(){
      document.getElementById('app').innerHTML = `
        <div class="container" style="padding:28px 0">
          <div class="title-row">
            <h2><i class="fa-solid fa-bell" style="color:var(--info)"></i> Notifications</h2>
            <div class="muted">${state.notifications.length} item(s)</div>
          </div>
          ${
            state.notifications.length
              ? `<div style="display:grid;gap:14px">${state.notifications.map(n => `
                  <div class="notification-card">
                    <div style="font-weight:800;color:var(--primary)">${escapeHtml(n.title)}</div>
                    <div style="margin-top:6px;line-height:1.65">${escapeHtml(n.body)}</div>
                    <div class="muted small" style="margin-top:10px">${new Date(n.createdAt).toLocaleString()}</div>
                  </div>
                `).join('')}</div>`
              : `<div class="empty"><i class="fa-regular fa-bell" style="font-size:44px;margin-bottom:10px"></i><div>No notifications yet.</div></div>`
          }
          <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
            <button class="btn-secondary" onclick="goHome()">Back to Store</button>
            ${state.notifications.length ? `<button class="btn-danger" onclick="clearNotifications()">Clear Notifications</button>` : ''}
          </div>
        </div>
      `;
    }

    function clearNotifications(){
      state.notifications = [];
      persistLocal();
      showNotificationsPage();
      toast('Notifications cleared');
    }

    function openProductDetail(id){
      const p = state.products.find(x => Number(x.id) === Number(id));
      if(!p) return;
      state.selectedProduct = p;
      rememberViewed(p.id);

      document.getElementById('productDetailContent').innerHTML = `
        <div class="modal-head">
          <h2 style="margin:0;color:var(--primary)">${escapeHtml(p.name)}</h2>
          <button class="close-btn" onclick="closeModal('productDetailModal')"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:22px" class="product-detail-grid">
          <div class="panel" style="display:grid;place-items:center;padding:26px;background:linear-gradient(180deg,var(--bg),var(--surface))">
            ${productImage(p)
              ? `<img src="${escapeHtml(productImage(p))}" alt="${escapeHtml(p.name)}" style="max-height:420px;object-fit:contain">`
              : `<i class="fa-solid fa-image" style="font-size:80px;color:var(--muted)"></i>`
            }
          </div>

          <div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
              ${Number(p.is_best_selling) === 1 ? `<span class="tag">Featured</span>` : ''}
              ${Number(p.stock) > 0 ? `<span class="tag" style="background:rgba(59,130,246,.12);color:#2563eb">In stock: ${p.stock}</span>` : `<span class="tag" style="background:rgba(239,68,68,.12);color:#ef4444">Out of stock</span>`}
            </div>
            ${generateStars(p.rating || 4)}
            <div style="margin:16px 0 10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
              <div class="price">${formatMoney(p.price)}</div>
              ${p.old_price ? `<div class="old">${formatMoney(p.old_price)}</div>` : ''}
            </div>
            <p style="line-height:1.8;color:var(--text)">${escapeHtml(p.description || 'No detailed description available for this product yet.')}</p>

            <div class="card-actions" style="margin-top:16px">
              ${
                !state.currentUser
                  ? `<button class="btn" onclick="closeModal('productDetailModal');showAuth('login')">Login to Buy</button>`
                  : state.currentUser.role === 'admin'
                    ? `<button class="btn" onclick="closeModal('productDetailModal');openAdmin()">Manage Product</button>`
                    : Number(p.stock) > 0
                      ? `<button class="btn" onclick="addToCart(${p.id})">Add to Cart</button>`
                      : `<button class="btn-secondary" disabled>Out of Stock</button>`
              }
              <button class="btn-secondary" onclick="toggleWishlist(${p.id})"><i class="fa-solid fa-heart"></i> Wishlist</button>
              ${state.currentUser && state.currentUser.role !== 'admin' ? `<button class="btn-outline" onclick="openReviewModal(${p.id}, '${escapeHtml(p.name)}')">Review</button>` : ''}
            </div>
          </div>
        </div>
      `;
      openModal('productDetailModal');
    }

    async function addToCart(productId){
      if(!state.currentUser) return showAuth('login');
      try{
        await apiFetch('/cart', {
          method:'POST',
          body: JSON.stringify({ product_id: productId, quantity: 1 })
        });
        await loadCart();
        addNotification('Cart updated', 'A product was added to your cart.');
        render();
        toast('Product added to cart');
      }catch(e){
        toast(e.message,'error');
      }
    }

    async function changeQty(productId, quantity){
      try{
        await apiFetch(`/cart/${productId}`, {
          method:'PUT',
          body: JSON.stringify({ quantity })
        });
        await loadCart();
        renderCartDrawer();
        render();
      }catch(e){
        toast(e.message,'error');
      }
    }

    async function removeCartItem(productId){
      try{
        await apiFetch(`/cart/${productId}`, { method:'DELETE' });
        await loadCart();
        renderCartDrawer();
        render();
        toast('Item removed');
      }catch(e){
        toast(e.message,'error');
      }
    }

    async function showCart(){
      if(!state.currentUser) return showAuth('login');
      await loadCart();
      renderCartDrawer();
      openDrawer();
    }

    function renderCartDrawer(){
      const root = document.getElementById('cartDrawerContent');
      if(!state.cart.length){
        root.innerHTML = `<div class="empty"><i class="fa-solid fa-cart-shopping" style="font-size:42px;margin-bottom:10px"></i><div>Your cart is empty.</div></div>`;
        return;
      }

      const subtotal = state.cart.reduce((sum, item) => sum + Number(item.price) * Number(item.quantity), 0);
      const discountAmount = subtotal * (state.discount / 100);
      const total = subtotal - discountAmount;

      root.innerHTML = `
        ${state.cart.map(item => `
          <div class="cart-item">
            ${
              productImage(item)
                ? `<img src="${escapeHtml(productImage(item))}" alt="${escapeHtml(item.name)}">`
                : `<div style="width:72px;height:72px;background:var(--bg);border:1px solid var(--border);border-radius:14px;display:grid;place-items:center"><i class="fa-solid fa-image" style="color:var(--muted)"></i></div>`
            }
            <div>
              <div style="font-weight:800;color:var(--primary)">${escapeHtml(item.name)}</div>
              <div class="muted small">${formatMoney(item.price)}</div>
              <div class="qty-row">

    async function checkout(method = 'cod'){
      try{
        const couponCode = document.getElementById('couponInput')?.value?.trim() || null;
        const mpesaPhone = document.getElementById('mpesaPhone')?.value?.trim() || null;

        const payload = method === 'mpesa'
          ? { couponCode, mpesaPhone }
          : { couponCode };

        await apiFetch('/orders', {
          method:'POST',
          body: JSON.stringify(payload)
        });

        state.discount = 0;
        await Promise.all([loadCart(), loadOrders(), bootstrap()]);
        closeDrawer();
        addNotification(
          method === 'mpesa' ? 'M-Pesa request sent' : 'Order placed',
          method === 'mpesa' ? 'Check your phone to complete payment.' : 'Your order was placed successfully.'
        );
        state.page = 'store';
        render();
        toast(method === 'mpesa' ? 'M-Pesa request sent to your phone' : 'Order placed successfully');
      }catch(e){
        toast(e.message,'error');
      }
    }

    async function sendResetLink(){
      try{
        const email = document.getElementById('forgotEmail').value.trim();
        if(!email) return toast('Enter your email', 'error');

        await apiFetch('/auth/forgot-password', {
          method:'POST',
          body: JSON.stringify({ email })
        });

        toast('Reset link sent to your email');
        addNotification('Password reset requested', 'A password reset email has been sent.');
        showAuth('login');
      }catch(e){
        toast(e.message,'error');
      }

    async function completePasswordReset(){
      try{
        const params = new URLSearchParams(location.search);
        const token = params.get('resetToken') || params.get('token') || params.get('reset_token');
        const password = document.getElementById('resetPassword').value;
        const confirmPassword = document.getElementById('resetPassword2').value;

        if(!token) return toast('Reset token missing in URL', 'error');
        if(!password || password.length < 8) return toast('Password must be at least 8 characters', 'error');
        if(password !== confirmPassword) return toast('Passwords do not match', 'error');

        await apiFetch('/auth/reset-password', {
          method:'POST',
          body: JSON.stringify({ token, password })
        });

        history.replaceState({}, '', location.pathname);
        closeModal('authModal');
        toast('Password updated successfully');
        showAuth('login');
      }catch(e){
        toast(e.message,'error');
      }
    }

    async function startBiometricLogin(){
      try{
        if(!window.PublicKeyCredential){
          return toast('This browser does not support biometrics', 'error');
        }

        const email = document.getElementById('loginEmail')?.value?.trim();
        if(!email) return toast('Enter your email first', 'error');

        const options = await apiFetch('/webauthn/login/options', {
          method:'POST',
          body: JSON.stringify({ email })
        });

        const credential = await window.SimpleWebAuthnBrowser.startAuthentication(options);

        const verification = await apiFetch('/webauthn/login/verify', {
          method:'POST',
          body: JSON.stringify({ email, credential })
        });

        state.token = verification.token;
        localStorage.setItem('urbanmart_token', state.token);
        state.currentUser = verification.user || decodeToken(verification.token);

        closeModal('authModal');
        await bootstrap();
        render();
        toast('Biometric login successful');
      }catch(e){
        toast(e.message || 'Biometric login failed', 'error');
      }
    }

    async function registerBiometric(){
      try{
        if(!state.currentUser) return toast('Login first before enabling biometrics', 'error');
        if(!window.PublicKeyCredential) return toast('This browser does not support biometrics', 'error');

        const options = await apiFetch('/webauthn/register/options', {
          method:'POST'
        });

        const credential = await window.SimpleWebAuthnBrowser.startRegistration(options);

        await apiFetch('/webauthn/register/verify', {
          method:'POST',
          body: JSON.stringify(credential)
        });

        addNotification('Biometrics enabled', 'You can now sign in with your device biometrics.');
        toast('Biometric authentication enabled');
      }catch(e){
        toast(e.message,'error');
      }
    }

    async function saveAddress(){
      const id = document.getElementById('addressId').value;
      const payload = {
        id: id ? Number(id) : Date.now(),
        label: document.getElementById('addressLabel').value.trim(),
        recipient_name: document.getElementById('addressRecipientName').value.trim(),
        phone: document.getElementById('addressPhone').value.trim(),
        county: document.getElementById('addressCounty').value.trim(),
        city: document.getElementById('addressCity').value.trim(),
        area: document.getElementById('addressArea').value.trim(),
        address_line: document.getElementById('addressLine').value.trim(),
        is_default: document.getElementById('addressDefault').checked
      };

      if(!payload.label || !payload.recipient_name || !payload.phone || !payload.county || !payload.city || !payload.area || !payload.address_line){
        return toast('Fill all address fields', 'error');
      }

      if(payload.is_default){
        state.addresses = state.addresses.map(a => ({ ...a, is_default: false }));
      }

      if(id){
        state.addresses = state.addresses.map(a => Number(a.id) === Number(id) ? payload : a);
      }else{
        state.addresses.unshift(payload);
      }

      persistLocal();
      closeModal('addressModal');
      renderProfile();
      toast('Address saved');
    }

    function setDefaultAddress(id){
      state.addresses = state.addresses.map(a => ({ ...a, is_default: Number(a.id) === Number(id) }));
      persistLocal();
      renderProfile();
      toast('Default address updated');
    }

    function deleteAddress(id){
      state.addresses = state.addresses.filter(a => Number(a.id) !== Number(id));
      persistLocal();
      renderProfile();
      toast('Address deleted');
    }

    async function downloadInvoice(orderNumber){
      try{
        const res = await fetch(`${API_URL}/orders/${orderNumber}/invoice`, {
          headers: { Authorization: `Bearer ${state.token}` }
        });
        if(!res.ok) throw new Error('Failed to generate invoice');

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `invoice_${orderNumber}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }catch(e){
        toast(e.message,'error');
      }
    }

    function logout(){
      state.token = '';
      state.currentUser = null;
      state.cart = [];
      state.orders = [];
      state.users = [];
      state.auditLogs = [];
      state.stats = {};
      state.page = 'store';
      localStorage.removeItem('urbanmart_token');
      closeModal('profileModal');
      render();
      toast('Logged out successfully');
    }

    function openAdmin(){
      if(state.currentUser?.role !== 'admin') return;
      state.page = 'admin';
      renderAdmin();
    }

    function setAdminTab(tab){
      state.adminTab = tab;
      renderAdmin();
    }

    function renderAdmin(){
      document.getElementById('app').innerHTML = `
        <div class="admin-layout">
          <aside class="sidebar">
            <div class="sidebar-brand"><i class="fa-solid fa-shield-halved"></i> UrbanMart</div>
            <div class="muted small" style="margin-bottom:18px;text-transform:uppercase;letter-spacing:1px">Admin Portal</div>
            <div class="side-menu">
              <button class="side-link ${state.adminTab === 'dashboard' ? 'active' : ''}" onclick="setAdminTab('dashboard')"><i class="fa-solid fa-chart-pie"></i> Dashboard</button>
              <button class="side-link ${state.adminTab === 'products' ? 'active' : ''}" onclick="setAdminTab('products')"><i class="fa-solid fa-box-open"></i> Products</button>
              <button class="side-link ${state.adminTab === 'orders' ? 'active' : ''}" onclick="setAdminTab('orders')"><i class="fa-solid fa-receipt"></i> Orders</button>
              <button class="side-link ${state.adminTab === 'users' ? 'active' : ''}" onclick="setAdminTab('users')"><i class="fa-solid fa-users"></i> Users</button>
              <button class="side-link ${state.adminTab === 'audit' ? 'active' : ''}" onclick="setAdminTab('audit')"><i class="fa-solid fa-clipboard-list"></i> Audit Logs</button>
              <button class="side-link" onclick="goHome()"><i class="fa-solid fa-store"></i> Storefront</button>
            </div>
          </aside>
          <main class="admin-main">
            ${renderAdminContent()}
          </main>
        </div>
      `;

      if(state.adminTab === 'dashboard'){
        setTimeout(drawRevenueChart, 80);
      }
    }

    function renderAdminContent(){
      if(state.adminTab === 'dashboard'){
        const lowStock = state.products.filter(p => Number(p.stock) <= 5).length;

        return `
          <div class="section-head">
            <div>
              <h2>Analytics Dashboard</h2>
              <div class="muted">Store KPIs and inventory alerts</div>
            </div>
          </div>

          <div class="stats">
            <div class="stat">
              <div class="label">Revenue</div>
              <div class="value">${formatMoney(state.stats.totalRevenue || 0)}</div>
            </div>
            <div class="stat">
              <div class="label">Orders</div>
              <div class="value">${state.stats.totalOrders || 0}</div>
            </div>
            <div class="stat">
              <div class="label">Customers</div>
              <div class="value">${state.stats.totalUsers || 0}</div>
            </div>
            <div class="stat">
              <div class="label">Low Stock</div>
              <div class="value">${lowStock}</div>
            </div>
          </div>

          <div class="admin-grid">
            <div class="box">
              <h3 style="margin-top:0;color:var(--primary)">Revenue Timeline</h3>
              <canvas id="revenueChart" height="150"></canvas>
            </div>
            <div style="display:grid;gap:18px">
              <div class="box">
                <h3 style="margin-top:0;color:var(--primary)">Critical Inventory</h3>
                ${
                  lowStock
                    ? state.products.filter(p => Number(p.stock) <= 5).map(p => `
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)">
                          <span style="font-weight:700">${escapeHtml(p.name)}</span>
                          <span class="tag" style="background:rgba(239,68,68,.12);color:#ef4444">${p.stock} left</span>
                        </div>
                      `).join('')
                    : `<div class="empty" style="padding:12px">Inventory looks healthy.</div>`
                }
              </div>
              <div class="box">
                <h3 style="margin-top:0;color:var(--primary)">Quick Actions</h3>
                <div class="card-actions">
                  <button class="btn" onclick="openProductModal()">Add Product</button>
                  <button class="btn-secondary" onclick="openCSVModal()">Bulk CSV Upload</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      if(state.adminTab === 'products'){
        return `
          <div class="section-head">
            <h2>Inventory</h2>
            <div class="card-actions">
              <button class="btn-secondary" onclick="openCSVModal()">Bulk CSV Upload</button>
              <button class="btn" onclick="openProductModal()">Add Product</button>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Featured</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${state.products.map(p => `
                  <tr>
                    <td>
                      <div style="display:flex;align-items:center;gap:12px">
                        ${productImage(p) ? `<img src="${escapeHtml(productImage(p))}" style="width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid var(--border)">` : `<div style="width:44px;height:44px;border-radius:10px;background:var(--bg);border:1px solid var(--border)"></div>`}
                        <div>
                          <div style="font-weight:800;color:var(--primary)">${escapeHtml(p.name)}</div>
                          <div class="muted small">${escapeHtml(p.description || '').slice(0,40)}</div>
                        </div>
                      </div>
                    </td>
                    <td>${escapeHtml(p.category_slug || '')}</td>
                    <td>${formatMoney(p.price)}</td>
                    <td>${p.stock}</td>
                    <td>${Number(p.is_best_selling) === 1 ? '<i class="fa-solid fa-check" style="color:var(--success)"></i>' : '-'}</td>
                    <td>
                      <div class="row-actions">
                        <button class="tiny" onclick="editProduct(${p.id})">Edit</button>
                        <button class="tiny" style="color:var(--danger)" onclick="deleteProduct(${p.id})">Delete</button>
                      </div>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      if(state.adminTab === 'orders'){
        return `
          <div class="section-head"><h2>Orders</h2></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Customer</th>
                  <th>Total</th>
                  <th>Status</th>
                  <th>Update</th>
                </tr>
              </thead>
              <tbody>
                ${state.orders.map(order => `
                  <tr>
                    <td>
                      <div style="font-weight:800;color:var(--primary)">${escapeHtml(order.order_number)}</div>
                      <div class="muted small">${new Date(order.created_at).toLocaleString()}</div>
                    </td>
                    <td>${escapeHtml(order.customer_name || '')}</td>
                    <td>${formatMoney(order.total)}</td>
                    <td><span class="status ${escapeHtml(order.status)}">${escapeHtml(order.status)}</span></td>
                    <td>
                      <select class="field" style="height:42px;padding:0 12px" onchange="updateOrderStatus(${order.id}, this.value)">
                        ${['Pending','Processing','Packed','Shipped','Delivered','Cancelled'].map(s => `<option value="${s}" ${order.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                      </select>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      if(state.adminTab === 'users'){
        return `
          <div class="section-head"><h2>Customers</h2></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Joined</th>
                </tr>
              </thead>
              <tbody>
                ${state.users.map(user => `
                  <tr>
                    <td>${escapeHtml(user.name)}</td>
                    <td>${escapeHtml(user.email)}</td>
                    <td>${escapeHtml(user.role)}</td>
                    <td>${new Date(user.created_at).toLocaleString()}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      if(state.adminTab === 'audit'){
        return `
          <div class="section-head"><h2>Audit Logs</h2></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Admin</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${state.auditLogs.map(log => `
                  <tr>
                    <td>${new Date(log.created_at).toLocaleString()}</td>
                    <td>${escapeHtml(log.user_name)}</td>
                    <td>${escapeHtml(log.action)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      return `<div class="empty">Select a module from the sidebar.</div>`;
    }

    function drawRevenueChart(){
      const ctx = document.getElementById('revenueChart');
      if(!ctx) return;

      if(state.charts.revenue){
        state.charts.revenue.destroy();
      }

      const dataMap = {};
      state.orders.forEach(o => {
        if(o.status === 'Cancelled') return;
        const day = new Date(o.created_at).toLocaleDateString(undefined, { month:'short', day:'numeric' });
        dataMap[day] = (dataMap[day] || 0) + Number(o.total);
      });

      const labels = Object.keys(dataMap);
      const data = labels.map(k => dataMap[k]);

      state.charts.revenue = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length ? labels : ['No Data'],
          datasets: [{
            label: 'Revenue',
            data: data.length ? data : [0],
            borderColor: '#10b981',
            backgroundColor: 'rgba(16,185,129,.10)',
            borderWidth: 3,
            tension: .35,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display:false } },
          scales: {
            y: { beginAtZero:true },
            x: { grid: { display:false } }
          }
        }
      });
    }

    function openProductModal(){
      document.getElementById('productModalContent').innerHTML = `
        <div class="modal-head">
          <h2 style="margin:0;color:var(--primary)">Add Product</h2>
          <button class="close-btn" onclick="closeModal('productModal')"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <input type="hidden" id="productId">
        <div class="form-group">
          <label>Name</label>
          <input class="field" id="productName">
        </div>

        <div class="two-col">
          <div class="form-group">
            <label>Category</label>
            <select class="field" id="productCategory">
              ${state.categories.map(c => `<option value="${escapeHtml(c.slug)}">${escapeHtml(c.name)}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Stock</label>
            <input class="field" id="productStock" type="number" min="0" value="10">
          </div>
        </div>

        <div class="two-col">
          <div class="form-group">
            <label>Price</label>
            <input class="field" id="productPrice" type="number" min="0" step="0.01">
          </div>
          <div class="form-group">
            <label>Old Price</label>
            <input class="field" id="productOldPrice" type="number" min="0" step="0.01">
          </div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea class="field" id="productDescription"></textarea>
        </div>

        <div class="form-group">
          <label>Image</label>
          <input class="field" id="productImage" type="file" accept="image/*" style="padding:14px">
        </div>

        <div class="form-group">
          <label style="display:flex;gap:10px;align-items:center;cursor:pointer">
            <input id="productBest" type="checkbox">
            Feature as premium selection
          </label>
        </div>

        <button class="btn" style="width:100%" onclick="saveProduct()">Save Product</button>
      `;
      openModal('productModal');
    }

    function editProduct(id){
      const p = state.products.find(x => Number(x.id) === Number(id));
      if(!p) return;

      openProductModal();
      document.querySelector('#productModalContent h2').textContent = 'Edit Product';
      document.getElementById('productId').value = p.id;
      document.getElementById('productName').value = p.name || '';
      document.getElementById('productCategory').value = p.category_slug || '';
      document.getElementById('productStock').value = p.stock ?? 0;
      document.getElementById('productPrice').value = p.price ?? '';
      document.getElementById('productOldPrice').value = p.old_price ?? '';
      document.getElementById('productDescription').value = p.description || '';
      document.getElementById('productBest').checked = Number(p.is_best_selling) === 1;
    }

    async function saveProduct(){
      try{
        const formData = new FormData();
        formData.append('name', document.getElementById('productName').value);
        formData.append('category_slug', document.getElementById('productCategory').value);
        formData.append('stock', document.getElementById('productStock').value);
        formData.append('price', document.getElementById('productPrice').value);
        formData.append('description', document.getElementById('productDescription').value);
        formData.append('is_best_selling', document.getElementById('productBest').checked ? 'true' : 'false');
        const oldPrice = document.getElementById('productOldPrice').value;
        if(oldPrice) formData.append('old_price', oldPrice);

        const file = document.getElementById('productImage').files[0];
        if(file) formData.append('image', file);

        const id = document.getElementById('productId').value;
        if(id){
          await apiFetch(`/products/${id}`, { method:'PUT', body: formData });
        }else{
          await apiFetch('/products', { method:'POST', body: formData });
        }

        closeModal('productModal');
        await Promise.all([bootstrap(), loadAdminData()]);
        renderAdmin();
        toast('Product saved successfully');
      }catch(e){
        toast(e.message,'error');
      }
    }

    async function deleteProduct(id){
      if(!confirm('Delete this product permanently?')) return;
      try{
        await apiFetch(`/products/${id}`, { method:'DELETE' });
        await Promise.all([bootstrap(), loadAdminData()]);
        renderAdmin();
        toast('Product deleted');
      }catch(e){
        toast(e.message,'error');
      }
    }

    function openCSVModal(){
      document.getElementById('csvModalContent').innerHTML = `
        <div class="modal-head">
          <h2 style="margin:0;color:var(--primary)">Bulk CSV Upload</h2>
          <button class="close-btn" onclick="closeModal('csvModal')"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="panel" style="background:var(--bg);margin-bottom:16px">
          <p class="muted small" style="margin:0;line-height:1.7">
            Required columns: <b>name, category_slug, price, stock, description</b>
          </p>
        </div>
        <div class="form-group">
          <input class="field" type="file" id="csvFile" accept=".csv" style="padding:14px">
        </div>
        <button class="btn" style="width:100%" onclick="uploadCSV()">Upload CSV</button>
      `;
      openModal('csvModal');
    }

    async function uploadCSV(){
      try{
        const file = document.getElementById('csvFile').files[0];
        if(!file) return toast('Select a CSV file first', 'error');

        const formData = new FormData();
        formData.append('csv', file);

        await apiFetch('/products/bulk', { method:'POST', body: formData });
        closeModal('csvModal');
        await Promise.all([bootstrap(), loadAdminData()]);
        renderAdmin();
        toast('Bulk inventory uploaded successfully');
      }catch(e){
        toast(e.message,'error');
      }
    }

    async function updateOrderStatus(orderId, status){
      try{
        await apiFetch(`/orders/${orderId}`, {
          method:'PUT',
          body: JSON.stringify({ status })
        });
        await loadAdminData();
        renderAdmin();
        toast('Order status updated');
      }catch(e){
        toast(e.message,'error');
      }
    }

    async function handleSpecialLinksFromUrl(){
      const params = new URLSearchParams(window.location.search);
      const resetToken = params.get('resetToken');
      if(resetToken){
        showAuth('reset');
      }
    }

    async function keepAlive(){
      if(!state.token) return;
      try{
        await apiFetch('/heartbeat');
      }catch{}
    }

    document.addEventListener('click', (e) => {
      if(e.target.classList.contains('modal')){
        e.target.classList.remove('show');
      }
    });

    window.addEventListener('keydown', (e) => {
      if(e.key === 'Escape'){
        document.querySelectorAll('.modal.show').forEach(m => m.classList.remove('show'));
        closeDrawer();
      }
    });

    async function init(){
      render();
      await bootstrap();
      await handleSpecialLinksFromUrl();
      render();
      setInterval(keepAlive, 300000);
    }

    init();
  </script>
</body>
</html>
